name: heimdall

networks:
  agents-net:
    internal: true
  outside: {}

volumes:
  # The placeholder vault (real personal data). Survives rebuilds and recreates;
  # only `docker compose down -v` removes it. Mounted into the gateway, never into agents.
  gateway-state: {}

services:
  gateway:
    # A's gateway (core/gateway.py): MCP tools at /mcp and the model proxy at /model on 8080.
    # Built from the repo root because the image needs core/ and uv.lock.
    build: { context: ../.., dockerfile: images/gateway/Dockerfile }
    networks: [agents-net, outside]
    env_file:
      - path: ../../.env
        required: false
    environment:
      HEIMDALL_FAKE_KEYS: openclaw:sk-fake-openclaw-01,hermes:sk-fake-hermes-01
    volumes:
      # Each agent's permissions.json. User folders are added by the agent manager
      # (data/gateway/compose.folders.yaml) at /data/folders/<name>.
      - ../../data/agents:/config/agents:ro
      - gateway-state:/state
