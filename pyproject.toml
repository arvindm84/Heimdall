[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.3",
    "pydantic>=2",
    "pywebview==6.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agents", "backend"]
addopts = "--import-mode=importlib"
markers = ["docker: needs Docker running; starts real containers"]
