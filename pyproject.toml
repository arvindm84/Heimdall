[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = [
    "docker>=7.2.0",
    "flask>=3.1.3",
    "pytest>=8",
]
gateway = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "en-core-web-sm",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp==1.30.0",
    "pypdf>=7.1.0",
    "spacy>=3.8,<3.9",
]

[tool.uv]
default-groups = ["dev", "gateway"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agents", "tests"]
addopts = "--import-mode=importlib"
markers = ["docker: needs Docker running; starts real containers"]
