[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]
gateway = ["httpx>=0.28.1", "mcp==1.30.0"]

[tool.uv]
default-groups = ["dev", "gateway"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["docker: needs Docker running; starts real containers"]
