[project]
name = "heimdall"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agents"]
addopts = "--import-mode=importlib"
markers = ["docker: needs Docker running; starts real containers"]
